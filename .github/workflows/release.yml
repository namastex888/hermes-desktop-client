name: build-and-publish

# Zero-maintenance mirror: watch upstream releases, build client-only
# installers for all three platforms, publish them. No human step unless a
# build gate fails.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (default: latest release)"
        required: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ver: ${{ steps.v.outputs.ver }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. If upstream goes quiet that long, the cron would die and then
      # miss the next release. Nudge the repo well before the cutoff.
      - name: Keepalive
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "last commit ${AGE}d ago"
          if [ "$AGE" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (scheduled workflows expire at 60d idle)"
            git push
          fi

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true"  >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Needed to generate the hicolor icon set (upstream ships only 1024x1024).
      - name: Icon tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build.sh "${{ needs.resolve.outputs.tag }}" "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Independent, content-based check of the Linux payload before anything
  # can publish. Deliberately separate from build.sh's path classifier:
  # this inspects the extracted tree (ELF-ness is only evaluable there).
  # Skips when resolve says the release already exists (needed=false).
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux
          path: installers-linux

      - name: Verify client-only payload
        shell: bash
        run: |
          DEB=$(ls installers-linux/*.deb | head -1)
          T=$(mktemp -d)
          dpkg-deb -x "$DEB" "$T"
          .github/scripts/verify-client-only.sh "$T"

  publish:
    needs: [resolve, build, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VER: ${{ needs.resolve.outputs.ver }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* --repo "$REPO" \
            --title "hermes-desktop $VER" \
            --notes "Client-only build of upstream [\`$TAG\`](https://github.com/NousResearch/hermes-agent/releases/tag/$TAG).

          No Python, no venv, no gateway — the Electron client only.

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$REPO/main/install.sh | sh
          \`\`\`

          macOS and Windows builds are unsigned; see the README."

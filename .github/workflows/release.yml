name: build-and-publish

# Zero-maintenance mirror: watch upstream releases, build client-only
# installers for all three platforms, publish them. No human step unless a
# build gate fails.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (default: latest release)"
        required: false
      upstream_ref:
        description: "Upstream branch/sha to build instead of a tag (e.g. main). Publishes as main-<date> and marks it Latest."
        required: false

permissions:
  contents: write
  # Sigstore build provenance: id-token mints the OIDC token that binds the
  # attestation to THIS workflow, attestations stores the resulting bundle.
  id-token: write
  attestations: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.v.outputs.build_ref }}
      rel_tag: ${{ steps.v.outputs.rel_tag }}
      ver: ${{ steps.v.outputs.ver }}
      desc: ${{ steps.v.outputs.desc }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. If upstream goes quiet that long, the cron would die and then
      # miss the next release. Nudge the repo well before the cutoff.
      - name: Keepalive
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "last commit ${AGE}d ago"
          if [ "$AGE" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (scheduled workflows expire at 60d idle)"
            git push
          fi

      # Two modes. Default (and the cron) mirrors an upstream TAG. Passing
      # upstream_ref builds a moving ref instead — normally `main`, which runs
      # thousands of commits ahead of the newest tag, so it is the only way to
      # ship current upstream work on the stable channel.
      #
      # Inputs are read through env, never interpolated into the script body:
      # `desc` carries backticks and would otherwise be executed as command
      # substitution the moment it is expanded.
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.upstream_ref }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REF" ]; then
            SHA=$(gh api "repos/NousResearch/hermes-agent/commits/$REF" --jq .sha)
            VER="$(date -u +%Y.%-m.%-d)"
            # The `main-` prefix cannot collide with upstream's vYYYY.M.D tags,
            # so mirroring a real upstream tag later still works untouched.
            REL_TAG="main-$VER"
            BUILD_REF="$SHA"
            NEEDED=true
            DESC="upstream \`$REF\` at [NousResearch/hermes-agent@${SHA:0:7}](https://github.com/NousResearch/hermes-agent/commit/$SHA)"
          else
            TAG="$IN_TAG"
            [ -n "$TAG" ] || TAG=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
            VER="${TAG#v}"
            REL_TAG="$TAG"
            BUILD_REF="$TAG"
            if gh release view "$REL_TAG" --repo "$REPO" >/dev/null 2>&1; then
              NEEDED=false
            else
              NEEDED=true
            fi
            DESC="upstream [\`$TAG\`](https://github.com/NousResearch/hermes-agent/releases/tag/$TAG)"
          fi
          {
            echo "build_ref=$BUILD_REF"
            echo "rel_tag=$REL_TAG"
            echo "ver=$VER"
            echo "desc=$DESC"
            echo "needed=$NEEDED"
          } >> "$GITHUB_OUTPUT"
          echo "building $BUILD_REF -> release $REL_TAG (version $VER, needed=$NEEDED)"

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Needed to generate the hicolor icon set (upstream ships only 1024x1024).
      - name: Icon tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Build
        shell: bash
        env:
          VER_OVERRIDE: ${{ needs.resolve.outputs.ver }}
          GH_TOKEN: ${{ github.token }}
          # Mac-only signing + notarization; empty on other platforms so the
          # p12 is never offered to the Windows codesigner. Absent secrets
          # leave the build unsigned — and build.sh then FAILS rather than
          # publishing an artifact the release notes call notarized.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: ./build.sh "${{ needs.resolve.outputs.build_ref }}" "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          # Purely a hand-off to the publish job; the installers that matter
          # end up on the release. At ~275MB a build the 90-day default piled
          # up 16GB of dead weight and the account hit its storage quota,
          # which surfaces as an opaque upload failure with the build itself
          # green:
          #   Failed to FinalizeArtifact: ... (403) Forbidden
          retention-days: 1

  # Independent, content-based check of the Linux payload before anything
  # can publish. Deliberately separate from build.sh's path classifier:
  # this inspects the extracted tree (ELF-ness is only evaluable there).
  # Skips when resolve says the release already exists (needed=false).
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux
          path: installers-linux

      - name: Verify client-only payload
        shell: bash
        run: |
          DEB=$(ls installers-linux/*.deb | head -1)
          T=$(mktemp -d)
          dpkg-deb -x "$DEB" "$T"
          .github/scripts/verify-client-only.sh "$T"

  publish:
    needs: [resolve, build, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One manifest over the merged set from every platform. Generated here
      # rather than in build.sh because each platform build has only its own
      # artifacts, and three same-named manifests would collide under
      # merge-multiple.
      - name: Checksum manifest
        run: |
          cd dist
          # Explicitly exclude SHA256SUMS rather than relying on `*` being
          # expanded before the redirection creates the file.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | sort | xargs -r sha256sum -- > SHA256SUMS
          cat SHA256SUMS

      # Keyless Sigstore signing. The attestation binds each artifact's digest
      # to this repository, workflow and commit, and is logged in a public
      # transparency log. This is the Linux-side answer to notarization: there
      # is no OS-level notary on Linux, so provenance is what a user can
      # actually verify:
      #   gh attestation verify Hermes-*.deb --repo ${{ github.repository }}
      # No long-lived signing key exists to leak or rotate.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.rel_tag }}
          VER: ${{ needs.resolve.outputs.ver }}
          DESC: ${{ needs.resolve.outputs.desc }}
        run: |
          ls -la dist
          TITLE="hermes-desktop $VER"
          NOTES="Client-only build of $DESC.

          No Python, no venv, no gateway — the Electron client only.

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$REPO/main/install.sh | sh
          \`\`\`

          **macOS** \`.dmg\` (Intel + Apple Silicon) — signed with a Developer ID, hardened runtime, **notarized by Apple and stapled**. The disk image itself carries the ticket, so Gatekeeper clears it offline: no \`xattr\` dance, no \"damaged\" dialog.

          **Linux** \`.deb\` / \`.AppImage\` — no OS-level notary exists on Linux, so every artifact ships with Sigstore build provenance instead:

          \`\`\`sh
          gh attestation verify Hermes-$VER-linux-amd64.deb --repo $REPO
          \`\`\`

          \`SHA256SUMS\` covers every asset on this release. The **Windows** build remains unsigned (no Authenticode certificate); see the README."

          # A re-dispatch on the same day targets a release that already
          # exists (main-<date> is date-derived), so replace its assets rather
          # than failing. --latest is explicit: gh's automatic choice is
          # date/semver based, and a main-<date> tag is neither.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
              | while read -r a; do gh release delete-asset "$TAG" "$a" --repo "$REPO" -y; done
            gh release upload "$TAG" dist/* --repo "$REPO"
            gh release edit "$TAG" --repo "$REPO" --latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* --repo "$REPO" --latest \
              --title "$TITLE" --notes "$NOTES"
          fi
